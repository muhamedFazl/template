<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Platformer Template</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- UI Overlay / HUD -->
    <div id="ui-layer">
      <div class="top-bar">
        <div class="title-badge">🎮 2D Platformer Template</div>
        <div class="stats-badge" id="statsDisplay">FPS: 60 | Respawns: 0</div>
      </div>

      <div class="bottom-bar">
        <div class="controls-guide">
          <span class="key-pill"><kbd>A</kbd> / <kbd>D</kbd> Move & Swing</span>
          <span class="key-pill"><kbd>Space</kbd> Jump / Boost</span>
          <span class="key-pill"><kbd>Right Click</kbd> / <kbd>E</kbd> Grapple</span>
          <span class="key-pill"><kbd>W</kbd> / <kbd>S</kbd> Reel</span>
          <span class="key-pill"><kbd>R</kbd> Respawn</span>
          <span class="key-pill"><kbd>F3</kbd> Debug</span>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
